[workspace]
name = "wuji-mjlab"
version = "0.1.0"
description = "Reinforcement learning and sim-to-real deployment for the Wuji Hand dexterous manipulation platform, built on mjlab and MuJoCo Warp."
license = "Apache-2.0"
channels = ["https://prefix.dev/conda-forge", "nvidia"]
# glibc floor: wuji_sdk ships manylinux_2_34-only wheels; the solver needs glibc>=2.34.
platforms = [{ platform = "linux-64", glibc = "2.34" }]

[dependencies]
python = "3.11.*"
pytest = ">=9.0"
ruff = ">=0.6,<1"
pre-commit = ">=3.6"
libstdcxx-ng = ">=15.2.0,<16"

[pypi-options]
index-strategy = "unsafe-best-match"

# The training stack. Only environments that list this feature install it, so
# the pen-spin deploy environment stays free of torch and the CUDA libraries.
[feature.train.pypi-options]
# PyTorch's CUDA 12.8 index is needed for Blackwell (sm_120/RTX 50) support.
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]
# CPU-only/non-NVIDIA users can remove this index and fall back to the default torch wheel.

[feature.train.pypi-dependencies]
wuji-mjlab = { path = ".", editable = true }
mjlab = { version = "==1.6.0", extras = ["cu128"] }
rsl-rl-lib = "==5.4.2"
gym = "==0.26.2"
omegaconf = ">=2.3.0"
tensorboardX = ">=2.6.2"
onnxruntime = ">=1.24.4, <2"
torch = ">=2.7.0,<2.8"
warp-lang = ">=1.14,<2"
scipy = ">=1.15,<2"
# pin <2: trimesh mesh.show() incompatible with pyglet 2.x (as of trimesh 4.12)
pyglet = ">=1.5,<2"

[feature.train.tasks]
train = { cmd = "python scripts/train/train_rsl_rl.py", description = "Train a task with rsl_rl (append --task and overrides)" }
play = { cmd = "python scripts/play/play_rsl_rl.py", description = "Play/infer from rsl_rl checkpoint" }
list-envs = { cmd = "python scripts/list_envs.py", description = "List Wuji tasks (pass --all to include upstream examples)" }
export-onnx = { cmd = "python -m wuji_mjlab.rl.onnx_export", description = "Export an rsl_rl checkpoint to <run dir>/policy.onnx (append <model_N.pt>)" }


[environments]
default = { features = ["train"], solve-group = "default" }
# One environment per deploy task, named `<task>-deploy`, so their dependency
# sets can diverge as tasks are added.
reorient-deploy = { features = ["train", "reorient-deploy"], solve-group = "default" }
pen-spin-deploy = { features = ["pen-spin-deploy"], solve-group = "default" }

[feature.reorient-deploy.pypi-dependencies]
# The deploy library itself. Declared here rather than at the top level so it
# stays out of the training `default` environment, like the two hand SDKs below.
wuji-reorient-deploy = { path = "deploy/reorient", editable = true }
opencv-contrib-python = ">=4.13,<5"
pupil-apriltags = ">=1.0"
pyzmq = ">=27.0"
pyyaml = ">=6.0"
wujihandpy = "==1.5.1"  # gen1 driver; lazy import keeps gen2 and --mock usable without it
wuji_sdk = "==2026.7.2"  # gen2 driver; its manylinux_2_34 wheels require the workspace glibc floor, and lazy import keeps --mock usable
# Hikvision MVS is not on PyPI; deployment requires its vendor SDK to be installed separately.

[feature.pen-spin-deploy.pypi-dependencies]
wuji-pen-spin-deploy = { path = "deploy/pen_spin", editable = true }
pyrealsense2 = "==2.58.1.10581"
onnxruntime = ">=1.24.4, <2"
mujoco = ">=3.3, <4"
pyzmq = ">=27.0"
pyyaml = ">=6.0"
opencv-contrib-python = ">=4.13,<5"
wuji_sdk = "==2026.7.2"
matplotlib = ">=3.8, <4"
# DDS for the real backend runs in the unitree_deploy conda env (cp310 wheels);
# this env is py3.11 which has no cyclonedds wheel.

# Task names live in one namespace per environment, so each deploy task gets its
# own feature + environment and these short verbs stay reusable across tasks.
# Two features defining the same name in one environment silently shadow one of
# them instead of erroring.
[feature.reorient-deploy.tasks]
vision    = { cmd = "python deploy/reorient/scripts/cube_world_observer.py --preview", description = "Launch ArUco/AprilTag cube observer with OpenCV preview window (publishes cube pose on ZMQ:5555); gen-agnostic (camera/vision only, no --gen)" }
play-real = { cmd = "python deploy/reorient/scripts/run_policy.py", description = "Run policy + stream targets to the hand (pass -- --gen N --hand H / --mock)" }
render    = { cmd = "python deploy/reorient/scripts/render_viewer.py", description = "Passive mirror viewer: subscribes to cube/goal/joint ZMQ and animates the hand (no hardware); pass -- --gen N --hand H" }
home      = { cmd = "python deploy/reorient/tools/home_check.py", description = "Drive all 20 joints to the cage home pose (gen selected via -- --gen N)" }
check     = { cmd = "python deploy/reorient/tools/check_setup.py", description = "Preflight check: deps, SDKs, policy (gen selected via -- --gen N)" }

[feature.pen-spin-deploy.tasks]
pen-observer = { cmd = "python deploy/pen_spin/scripts/pen_world_observer.py --source camera", description = "Start the pen camera observer and publish pose on ZMQ:5555" }
pen-sim = { cmd = "python deploy/pen_spin/scripts/pen_pose_viewer.py", description = "Start the standalone MuJoCo pen viewer" }
pen-policy = { cmd = "python -m runtime", description = "After pen-observer: start real-hand policy control with the live MuJoCo mirror (pass --policy <policy.onnx> --motion <clip.npz>; --no-sim disables the mirror)" }

pen-observer-realsense = { cmd = "python deploy/pen_spin/scripts/pen_world_observer.py --source realsense", description = "D435/D435i global-shutter IR1 observer, active-stream calibration" }

pen-tag-test = { cmd = "python deploy/pen_spin/scripts/pen_world_observer.py --source realsense --detect-only --preview", description = "Full-sheet AprilTag and custom pen detection with 2D tracks; no pose solve or publication" }

pen-tag-test-50 = { cmd = "python deploy/pen_spin/scripts/pen_world_observer.py --source realsense --detect-only --preview --detect-hz 50 --camera-config deploy/pen_spin/config/realsense_sheet_50.yaml", description = "A4 detection at up to 50 Hz with 848x480 IR1 capture at 60 FPS" }

pen-tag-test-stereo = { cmd = "python deploy/pen_spin/scripts/pen_world_observer.py --source realsense --detect-only --stereo --preview --detect-hz 30 --camera-config deploy/pen_spin/config/realsense_sheet_max.yaml", description = "Highest-resolution paired IR sheet test: 1280x800 per view at up to 30 Hz" }
pen-tag-test-stereo-50 = { cmd = "python deploy/pen_spin/scripts/pen_world_observer.py --source realsense --detect-only --stereo --preview --detect-hz 50 --camera-config deploy/pen_spin/config/realsense_sheet_50.yaml", description = "Paired IR comparison profile: 848x480 at up to 50 detection Hz" }

pen-tag-benchmark = { cmd = "python deploy/pen_spin/tools/tag_benchmark.py", description = "Record raw IR pairs, annotate independent A4 truth, compare detector stages and review false detections" }

z5-bridge = { cmd = "python deploy/pen_spin/tools/z5_pose_bridge.py --in-port 5556 --out-port 5555", description = "Republish the pen observer pose (wrist-tag frame :5556) as palm_link tracking quat on :5555 for the Z5 bundle" }
z5-play = { cmd = "python third_party/z5-pen-spin-deploy/deploy/z5_pen_spin/scripts/play_real.py --engine onnx", description = "Run the exported Z5 pen-spin policy (append --backend mujoco|real etc.)" }
z5-probe = { cmd = "python deploy/pen_spin/tools/z5_policy_probe.py", description = "Camera-only action probe: live palm_link pose + ONNX policy + mock hand, no DDS" }
z5-check-pose = { cmd = "python third_party/z5-pen-spin-deploy/deploy/z5_pen_spin/scripts/check_pose.py", description = "Compare live palm_link pen pose with a reference clip frame (append --clip ID)" }
# The exported scene.mjb is locked to mujoco 3.15; mjlab pins this env to <3.12,
# so the sim runs in a cached pixi-exec env instead of the project env.
z5-sim = { cmd = "pixi exec --spec 'mujoco==3.15.0' --spec 'onnxruntime' --spec 'pyzmq' --spec 'numpy' -- python third_party/z5-pen-spin-deploy/deploy/z5_pen_spin/scripts/play_real.py --engine onnx --backend mujoco", description = "Closed-loop MuJoCo rollout of the exported bundle (append --steps/--viewer)" }
z5-sim-chain = { cmd = "pixi exec --spec 'mujoco==3.15.0' --spec 'onnxruntime' --spec 'pyzmq' --spec 'numpy' -- python deploy/pen_spin/tools/z5_sim_chain.py", description = "Sim-to-sim full chain: virtual observer -> real z5_pose_bridge -> ONNX policy -> MuJoCo execution" }
z5-vision-sim = { cmd = "pixi exec --spec 'mujoco==3.15.0' --spec 'onnxruntime' --spec 'pyzmq' --spec 'numpy' --spec 'opencv' --spec 'pyyaml' -- python deploy/pen_spin/tools/z5_visual_sim.py", description = "Vision-in-the-loop sim: render -> real tag/pen detection -> bridge -> ONNX -> MuJoCo (append --steps/--save-frames)" }
z5-real-preflight = { cmd = "python deploy/pen_spin/tools/z5_real_preflight.py", description = "Pre-flight check for real-hardware deployment (no hand needed)" }
z5-flat-capture = { cmd = "/home/unitree/miniconda3/envs/unitree_deploy/bin/python deploy/pen_spin/tools/z5_flat_capture.py", description = "Capture the measured flat rest pose to outputs/flat_pose.npy (run while hand is flat, e.g. after -k calibration)" }
z5-play-real = { cmd = "/home/unitree/miniconda3/envs/unitree_deploy/bin/python third_party/z5-pen-spin-deploy/deploy/z5_pen_spin/scripts/play_real.py --engine onnx --backend real --sdk-path /home/unitree/Softwares/unitree_sdk2_python --kp 2 --kd 0.1", description = "Real-hardware policy run via unitree_deploy env (append --wire-convention X --pose-endpoint ... --clip ID --log out.npz)" }
z5-mirror = { cmd = "/home/unitree/miniconda3/envs/unitree_deploy/bin/python deploy/pen_spin/tools/z5_mirror.py --sdk-path /home/unitree/Softwares/unitree_sdk2_python", description = "Live MuJoCo mirror: real hand (DDS) + camera pen + reference ghost/trajectory (append --wire-convention X --clip ID)" }

# User-local Hikrobot MVS SDK (no sudo install): bindings + libs for --source camera.
[feature.pen-spin-deploy.activation]
env = { MVS_PYTHON_PATH = "${HOME}/.local/opt/MVS/Samples/64/Python", MVCAM_COMMON_RUNENV = "${HOME}/.local/opt/MVS/lib", ALLUSERSPROFILE = "${HOME}/.cache/MVS", LD_LIBRARY_PATH = "${HOME}/.local/opt/MVS/lib/64:${LD_LIBRARY_PATH:-}" }
